<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng Điểm Sinh Viên</title>

<style>
body{
    font-family: Arial;
    padding:20px;
}

table{
    border-collapse: collapse;
    width:600px;
    margin-top:15px;
}

th, td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#f2f2f2;
}

.low-score{
    background:yellow;
}

button{
    padding:5px 10px;
}

input{
    padding:6px;
}
</style>

</head>
<body>

<h2>Quản lý điểm sinh viên</h2>

<input id="name" placeholder="Họ tên">
<input id="score" type="number" placeholder="Điểm (0-10)">
<button id="addBtn">Thêm</button>

<table>
<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th>Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<p id="stats">Tổng SV: 0 | Điểm trung bình: 0</p>

<script>

let students = []

const nameInput = document.getElementById("name")
const scoreInput = document.getElementById("score")
const addBtn = document.getElementById("addBtn")
const tableBody = document.getElementById("tableBody")
const stats = document.getElementById("stats")

function getRank(score){

    if(score >= 8.5) return "Giỏi"
    if(score >= 7) return "Khá"
    if(score >= 5) return "Trung bình"
    return "Yếu"

}

function renderTable(){

    tableBody.innerHTML = ""

    students.forEach((sv,index)=>{

        let tr = document.createElement("tr")

        if(sv.score < 5){
            tr.classList.add("low-score")
        }

        tr.innerHTML = `
        <td>${index+1}</td>
        <td>${sv.name}</td>
        <td>${sv.score}</td>
        <td>${getRank(sv.score)}</td>
        <td>
            <button data-index="${index}" class="deleteBtn">Xóa</button>
        </td>
        `

        tableBody.appendChild(tr)

    })

    updateStats()

}

function updateStats(){

    let total = students.length
    let avg = 0

    if(total > 0){
        let sum = students.reduce((a,b)=> a + b.score ,0)
        avg = (sum/total).toFixed(2)
    }

    stats.textContent = `Tổng SV: ${total} | Điểm trung bình: ${avg}`

}

function addStudent(){

    let name = nameInput.value.trim()
    let score = parseFloat(scoreInput.value)

    if(name === "" || isNaN(score) || score < 0 || score > 10){
        alert("Dữ liệu không hợp lệ")
        return
    }

    students.push({
        name:name,
        score:score
    })

    renderTable()

    nameInput.value = ""
    scoreInput.value = ""

    nameInput.focus()

}

addBtn.addEventListener("click",addStudent)

scoreInput.addEventListener("keypress",function(e){

    if(e.key === "Enter"){
        addStudent()
    }

})

tableBody.addEventListener("click",function(e){

    if(e.target.classList.contains("deleteBtn")){

        let index = e.target.dataset.index

        students.splice(index,1)

        renderTable()

    }

})

</script>

</body>
</html>
